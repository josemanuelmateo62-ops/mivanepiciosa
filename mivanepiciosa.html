<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Vane Piciosa</title>
    <style>
        body {
            background-color: #ffeef2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        /* Panel de botones superiores */
        .controls {
            margin-bottom: 30px;
            z-index: 100;
            display: flex;
            gap: 15px;
        }

        button {
            background-color: #ff6584;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 101, 132, 0.3);
            transition: all 0.3s ease;
        }

        button:hover {
            background-color: #f43f63;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 101, 132, 0.4);
        }

        /* Contenedor principal animado */
        .container {
            position: relative;
            width: 500px;
            height: 550px;
            animation: growBouquet 2s forwards cubic-bezier(0.175, 0.885, 0.32, 1.1);
            transform-origin: bottom center;
        }

        @keyframes growBouquet {
            0% { transform: scale(0.6); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        /* Tallos perfectos que convergen en el centro del jarrón */
        .stem {
            position: absolute;
            width: 5px;
            background: linear-gradient(to top, #388e3c, #4caf50);
            bottom: 120px;
            left: 50%;
            transform-origin: bottom center;
            border-radius: 3px;
            z-index: 2;
        }
        .stem-1 { height: 260px; transform: translateX(-50%) rotate(-24deg); }
        .stem-2 { height: 290px; transform: translateX(-50%) rotate(-12deg); }
        .stem-3 { height: 310px; transform: translateX(-50%) rotate(0deg); }
        .stem-4 { height: 290px; transform: translateX(-50%) rotate(12deg); }
        .stem-5 { height: 260px; transform: translateX(-50%) rotate(24deg); }

        /* Contenedor de la Flor (Simétrico) */
        .flower {
            position: absolute;
            width: 80px;
            height: 80px;
            transform-origin: center center;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 5;
        }
        
        /* Posiciones exactas conectadas a la punta de cada tallo */
        .fl-1 { top: 130px; left: 85px; }
        .fl-2 { top: 75px; left: 150px; }
        .fl-3 { top: 50px; left: 210px; }
        .fl-4 { top: 75px; left: 270px; }
        .fl-5 { top: 130px; left: 335px; }

        /* Pétalos perfectamente centrados */
        .petal {
            position: absolute;
            background: linear-gradient(135deg, #ff8da1, #ff6584);
            border-radius: 50% 50% 10px 50%;
            width: 38px;
            height: 38px;
            opacity: 0.95;
            box-shadow: inset -2px -2px 6px rgba(0,0,0,0.15);
            transform-origin: center center;
            transform: rotate(var(--rot)) translateY(0px) scale(0);
            transition: transform 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.2);
        }
        
        .petal-1 { --rot: 0deg; }
        .petal-2 { --rot: 72deg; }
        .petal-3 { --rot: 144deg; }
        .petal-4 { --rot: 216deg; }
        .petal-5 { --rot: 288deg; }
        
        /* Animación: Florecer hacia afuera sin desalinearse */
        .flower.bloom .petal {
            transform: rotate(var(--rot)) translateY(-22px) scale(1) rotate(45deg);
        }

        /* Centro de la flor siempre centrado */
        .center {
            position: absolute;
            background: radial-gradient(circle, #fff9c4, #ffeb3b);
            border-radius: 50%;
            width: 24px;
            height: 24px;
            z-index: 6;
            transform: scale(0);
            transition: transform 0.6s ease-in-out;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .flower.bloom .center {
            transform: scale(1);
        }

        /* Jarrón / Envoltura del ramo */
        .wrapper {
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 150px;
            background: rgba(255, 255, 255, 0.5);
            border: 2px solid rgba(255, 255, 255, 0.7);
            border-radius: 20px 20px 100px 100px;
            backdrop-filter: blur(10px);
            z-index: 10;
            box-shadow: 0 15px 35px rgba(244, 143, 177, 0.25);
        }

        /* Lazo/moño decorativo */
        .ribbon-bow {
            position: absolute;
            bottom: 115px;
            left: 50%;
            transform: translateX(-50%);
            width: 35px;
            height: 16px;
            background-color: #ff3366;
            border-radius: 4px;
            z-index: 15;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .ribbon-bow::before, .ribbon-bow::after {
            content: '';
            position: absolute;
            width: 22px;
            height: 22px;
            background-color: #ff3366;
            border-radius: 50%;
            top: -3px;
        }
        .ribbon-bow::before { left: -14px; }
        .ribbon-bow::after { right: -14px; }
    </style>
</head>
<body>

    <!-- Panel de Control -->
    <div class="controls">
        <button id="btnBloom">🌸 Florecer Ramo</button>
        <button id="btnMusic">🎵 Poner Música</button>
    </div>

    <!-- Contenedor del Ramo Grande y Alineado -->
    <div class="container">
        <!-- Red de Tallos -->
        <div class="stem stem-1"></div>
        <div class="stem stem-2"></div>
        <div class="stem stem-3"></div>
        <div class="stem stem-4"></div>
        <div class="stem stem-5"></div>

        <!-- Flor 1 -->
        <div class="flower fl-1">
            <div class="petal petal-1"></div>
            <div class="petal petal-2"></div>
            <div class="petal petal-3"></div>
            <div class="petal petal-4"></div>
            <div class="petal petal-5"></div>
            <div class="center"></div>
        </div>

        <!-- Flor 2 -->
        <div class="flower fl-2">
            <div class="petal petal-1"></div>
            <div class="petal petal-2"></div>
            <div class="petal petal-3"></div>
            <div class="petal petal-4"></div>
            <div class="petal petal-5"></div>
            <div class="center"></div>
        </div>

        <!-- Flor 3 -->
        <div class="flower fl-3">
            <div class="petal petal-1"></div>
            <div class="petal petal-2"></div>
            <div class="petal petal-3"></div>
            <div class="petal petal-4"></div>
            <div class="petal petal-5"></div>
            <div class="center"></div>
        </div>

        <!-- Flor 4 -->
        <div class="flower fl-4">
            <div class="petal petal-1"></div>
            <div class="petal petal-2"></div>
            <div class="petal petal-3"></div>
            <div class="petal petal-4"></div>
            <div class="petal petal-5"></div>
            <div class="center"></div>
        </div>

        <!-- Flor 5 -->
        <div class="flower fl-5">
            <div class="petal petal-1"></div>
            <div class="petal petal-2"></div>
            <div class="petal petal-3"></div>
            <div class="petal petal-4"></div>
            <div class="petal petal-5"></div>
            <div class="center"></div>
        </div>

        <!-- Jarrón Limpio -->
        <div class="wrapper"></div>
        <!-- Moño -->
        <div class="ribbon-bow"></div>
    </div>

    <!-- Audio de prueba -->
    <audio id="bgMusic" loop src="cancion.mp3"></audio>

    <script>
        // Control de florecimiento simétrico
        const btnBloom = document.getElementById('btnBloom');
        const flowers = document.querySelectorAll('.flower');

        btnBloom.addEventListener('click', () => {
            flowers.forEach((flower, index) => {
                setTimeout(() => {
                    flower.classList.toggle('bloom');
                }, index * 150); // Efecto cascada elegante
            });

            // Cambiar texto dinámicamente según el estado de la primera flor
            setTimeout(() => {
                const isBlooming = flowers[0].classList.contains('bloom');
                btnBloom.innerText = isBlooming ? "✨ Cerrar Ramo" : "🌸 Florecer Ramo";
            }, 100);
        });

        // Control de música
        const btnMusic = document.getElementById('btnMusic');
        const music = document.getElementById('bgMusic');

        btnMusic.addEventListener('click', () => {
            if (music.paused) {
                music.play().catch(err => console.log("Permiso de audio requerido"));
                btnMusic.innerText = "⏸ Pausar Música";
                btnMusic.style.backgroundColor = "#4caf50";
            } else {
                music.pause();
                btnMusic.innerText = "🎵 Poner Música";
                btnMusic.style.backgroundColor = "#ff6584";
            }
        });
    </script>
</body>
</html>
